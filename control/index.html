<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Stance Prime — Control del negocio</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#6b7280;
  --primary:#111111; --primary2:#2b2b2b; --border:#e5e7eb;
  --success:#059669; --warning:#d97706; --danger:#dc2626;
  --shadow:0 8px 25px rgba(15,23,42,.07); --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#0a0a0a;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.brand{font-weight:800;font-size:20px;padding:8px 10px 22px;display:flex;gap:9px;align-items:center}
.brand-badge{width:34px;height:34px;border-radius:10px;background:#111111;display:grid;place-items:center}
.nav{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#cbd5e1;padding:12px 12px;border-radius:11px;margin:4px 0;text-align:left;gap:10px;align-items:center}
.nav button:hover,.nav button.active{background:#1c1c1c;color:#fff}
.sidebar-bottom{position:static;flex:0 0 auto;color:#94a3b8;font-size:11px;line-height:1.45;padding:12px 8px 2px;margin-top:8px;border-top:1px solid rgba(148,163,184,.12)}
.main{flex:1;padding:24px;max-width:1600px;margin:auto;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.topbar h1{font-size:26px;margin:0 0 4px}.topbar p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}
.btn-light{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:#fee2e2;color:#991b1b}
.grid{display:grid;gap:16px}
.cards{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.kpi{display:flex;justify-content:space-between;align-items:flex-start}.kpi-label{color:var(--muted);font-size:13px}.kpi-value{font-size:25px;font-weight:800;margin-top:6px}.kpi-icon{width:38px;height:38px;border-radius:12px;background:#f3f3f3;color:#111111;display:grid;place-items:center}
.two{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr)}.three{grid-template-columns:repeat(3,1fr)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{margin:0;font-size:17px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;white-space:nowrap}.table th{color:#64748b;font-weight:700}.table tr:last-child td{border-bottom:0}
.tag{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.tag-green{background:#dcfce7;color:#166534}.tag-yellow{background:#fef3c7;color:#92400e}.tag-red{background:#fee2e2;color:#991b1b}.tag-blue{background:#e5e5e5;color:#111111}.tag-gray{background:#f1f5f9;color:#475569}
.progress{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--primary)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;padding:10px 11px;background:#fff;outline:none}.toolbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#d4d4d4;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.toolbar input{min-width:220px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three-cols{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#475569}.field.full{grid-column:1/-1}
.small{font-size:12px;color:var(--muted)}
.size-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.size-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:9px;background:#f8fafc;border:1px solid var(--border);font-size:11px;font-weight:700}.size-chip.available{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.size-chip.empty-size{background:#fef2f2;border-color:#fecaca;color:#991b1b}.size-admin-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;margin-top:8px}.size-admin-row input{min-width:0}.size-admin-list{border:1px solid var(--border);border-radius:12px;padding:10px;background:#f8fafc;max-height:230px;overflow:auto}.size-admin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)}.size-admin-item:last-child{border-bottom:0}.size-admin-item .meta{font-size:12px;color:var(--muted)}.sell-size-note{font-size:12px;color:#64748b;margin-top:-2px}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff}.product-image{height:115px;min-height:115px;max-height:115px;background:linear-gradient(135deg,#eef2ff,#f8fafc);display:flex;align-items:center;justify-content:center;color:#64748b;font-size:34px;overflow:hidden}.product-image img{display:block;width:auto!important;height:auto!important;max-width:100%!important;max-height:100%!important;object-fit:contain;object-position:center}.product-body{padding:12px}.product-name{font-weight:800;margin-bottom:3px}.price{font-weight:800}.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px}
.alert{padding:11px 13px;border-radius:11px;font-size:13px;margin-bottom:12px}.alert-info{background:#f3f3f3;color:#111111}.alert-warn{background:#fff7ed;color:#9a3412}.alert-ok{background:#ecfdf5;color:#065f46}.plan-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 190px 40px;gap:8px;margin-bottom:8px;align-items:center}.plan-row input,.plan-row select{width:100%;min-width:0;box-sizing:border-box}.plan-del{padding:0;height:40px}@media(max-width:600px){.plan-row{grid-template-columns:minmax(0,1fr) 84px 44px;grid-template-areas:'n p d' 'k k k'}.plan-n{grid-area:n}.plan-p{grid-area:p}.plan-k{grid-area:k}.plan-d{grid-area:d}.plan-head{display:none}}.tag{white-space:nowrap}.equal2{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-grid.m2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:850px){.equal2{grid-template-columns:1fr}}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:13px;border-bottom:1px solid var(--border)}.checklist input{margin-top:2px}
.message{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}.message .label{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800}.message .txt{margin:6px 0;white-space:pre-line;font-size:13px}.message .actions{justify-content:flex-end}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(15,23,42,.25)}.modal h3{margin:0 0 14px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;background:#f1f5f9;border-radius:9px;width:34px;height:34px}
.toast{position:fixed;right:20px;bottom:20px;background:#0a0a0a;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);display:none;z-index:30}.toast.show{display:block}
.footer-note{font-size:11px;color:#94a3b8;margin-top:18px}

.period-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}.period-bar .label{font-size:12px;font-weight:800;color:#475569}.period-bar select,.period-bar input{border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:#fff;color:var(--text)}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric-box{padding:13px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}.metric-box .label{font-size:11px;color:var(--muted)}.metric-box .value{font-weight:800;font-size:18px;margin-top:4px}.metric-box .sub{font-size:11px;color:var(--muted);margin-top:2px}
.finance-highlight{border-radius:14px;padding:15px;background:linear-gradient(135deg,#f3f3f3,#f8fafc);border:1px solid #e5e5e5}.finance-highlight .big{font-size:29px;font-weight:900;margin-top:5px}.negative{color:#b91c1c!important}.positive{color:#047857!important}
.trend{display:grid;gap:9px}.trend-row{display:grid;grid-template-columns:70px 1fr 105px;gap:10px;align-items:center}.trend-label{font-size:11px;color:#64748b}.trend-bar{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}.trend-bar>div{height:100%;background:var(--primary)}.trend-value{font-size:11px;text-align:right;font-weight:800}.allocation-card{border:1px solid var(--border);border-radius:12px;padding:12px}.allocation-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}.allocation-row:last-child{border-bottom:0}
@media(max-width:1100px){.metric-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.metric-grid{grid-template-columns:1fr 1fr}.trend-row{grid-template-columns:58px 1fr 84px}}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.sidebar{width:70px;padding:12px 8px}.brand span,.nav button span,.sidebar-bottom{display:none}.nav button{justify-content:center}.main{padding:16px}.two,.three,.form-grid,.form-grid.three-cols{grid-template-columns:1fr}.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cards{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:1fr 1fr}.topbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}

body.locked .app,body.locked .modal-backdrop{display:none!important}
#auth:empty{display:none}
#auth{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0f172a,#1c1c1c);display:grid;place-items:center;padding:20px;overflow:auto}
.auth-box{width:min(400px,100%);background:#fff;border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:18px}
.auth-box h2{font-size:20px;margin:0 0 6px}
.auth-msg{min-height:18px;font-size:13px;color:#b42318;margin-top:10px}
.auth-link{background:none;border:0;color:#111111;font-weight:700;font-size:13px;margin-top:14px;cursor:pointer;width:100%}
.brand-badge{overflow:hidden}.brand-badge img{width:100%;height:100%;object-fit:cover}
.sidebar-bottom b{color:#e2e8f0}.sidebar-bottom span{color:#94a3b8}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ptile{position:relative;cursor:pointer}.ptile input{position:absolute;opacity:0;inset:0;cursor:pointer}
.ptile span{display:block;padding:10px 12px;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;font-weight:600;background:#fff;transition:.15s}
.ptile input:checked+span{background:#f3f3f3;border-color:#111111;color:#2b2b2b}
.ptile input:focus-visible+span{outline:2px solid #111111;outline-offset:2px}
.creds{display:grid;gap:10px;margin-top:12px}.creds div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.creds span{font-size:12px;color:#64748b;font-weight:700}.creds b{font-family:ui-monospace,Consolas,monospace;font-size:17px;word-break:break-all}
.brand-badge{background:#fff!important;color:#000!important}
</style>
</head>

<script type="text/plain" id="catTpl"><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<style>
:root{--ink:#0b0f14;--muted:#667085;--line:#e6e9ee;--soft:#f4f6f8;--ice:#8fd3f4;--ice-d:#0b7fb3;--bg:#fff;--ok:#12805c;--danger:#b42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:14px}
.logo i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ice);margin-right:9px;transform:translateY(-1px)}
.cartbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--ink);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;transition:background .2s,color .2s}
.cartbtn:hover{background:var(--ink);color:#fff}
.badge{min-width:22px;height:22px;border-radius:999px;background:var(--ice);color:var(--ink);display:inline-grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.hero{padding:44px 0 18px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ice-d);font-weight:700}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.03em;margin:10px 0 12px;font-weight:800}
.hero p{margin:0;color:var(--muted);max-width:560px;font-size:16px;line-height:1.5}
.pill{display:inline-flex;margin-top:16px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0 18px;position:sticky;top:62px;z-index:10;background:linear-gradient(#fff 80%,rgba(255,255,255,0))}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;white-space:nowrap;transition:all .18s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{border:1px solid var(--line);border-radius:999px;padding:10px 15px;min-width:170px;outline:none;font-size:14px;background:#fff}
.search:focus{border-color:var(--ice-d);box-shadow:0 0 0 3px rgba(143,211,244,.35)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:110px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease,box-shadow .25s,border-color .25s;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.card.in{opacity:1;transform:none}
.card:hover{box-shadow:0 14px 34px rgba(11,15,20,.09);border-color:#d3d9e0;transform:translateY(-3px)}
.ph{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;transition:transform .5s ease}
.card:hover .ph img{transform:scale(1.05)}
.ph span{font-size:44px;font-weight:800;color:#c3cad3}
.cb{padding:13px 14px 15px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:15px;line-height:1.25;font-weight:700}
.cb small{color:var(--muted);font-size:13px}
.cb .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.price{font-weight:800;font-size:16px}
.pick{font-size:12px;font-weight:700;color:var(--ice-d);letter-spacing:.02em}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 10px}

.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto;max-width:520px;margin:0 auto}
.sheet.on{transform:none}
@media(min-width:720px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:24px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:all .25s}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-img{width:92px;height:92px;border-radius:14px;background:var(--soft);flex:none;overflow:hidden;display:grid;place-items:center}
.sh-img img{width:100%;height:100%;object-fit:contain}
.sh-top h2{margin:0 0 4px;font-size:19px;line-height:1.2}
.sh-top p{margin:0;color:var(--muted);font-size:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 9px}

.stepper b{min-width:34px;text-align:center}

.btn.wa{background:#12805c}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:50;transform:translateX(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font-size:19px}
.x{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:18px}
.dr-b{flex:1;overflow:auto;padding:6px 20px}
.dr-f{border-top:1px solid var(--line);padding:16px 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item .th{width:64px;height:64px;border-radius:12px;background:var(--soft);overflow:hidden;flex:none;display:grid;place-items:center}
.item .th img{width:100%;height:100%;object-fit:contain}
.item .in{flex:1;min-width:0}
.item h4{margin:0;font-size:14px;line-height:1.25}
.item p{margin:3px 0 8px;color:var(--muted);font-size:13px}
.item .ctl{display:flex;align-items:center;justify-content:space-between}
.item .stepper button{width:32px;height:32px;font-size:17px}
.rm{border:0;background:none;color:var(--danger);font-size:13px;font-weight:600;padding:4px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.two>.fld{min-width:0}
.fld input{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;font-size:15px}
.fld input:focus{border-color:var(--ice-d);box-shadow:0 0 0 3px rgba(143,211,244,.35)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.note.warn{color:#9a6700;background:#fff7e0;border-radius:10px;padding:9px 11px}
.emptycart{text-align:center;color:var(--muted);padding:60px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:70;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px;text-align:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="logo" id="logo"></div><button class="cartbtn" id="openCart" aria-label="Ver mi pedido">Mi pedido <span class="badge" id="cnt">0</span></button></div></header>
<main class="wrap">
  <section class="hero"><div class="eyebrow">Catálogo</div><h1 id="h1"></h1><p id="intro"></p><div id="minpill"></div></section>
  <div class="tools"><div class="chips" id="chips"></div><input class="search" id="q" type="search" placeholder="Buscar…" aria-label="Buscar"></div>
  <section class="grid" id="grid"></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<aside class="drawer" id="drawer" aria-label="Mi pedido"></aside>
<div class="toast" id="toast"></div>

<script>
window.__SB__={url:'__SB_URL__',key:'__SB_KEY__'};
(function(){
var SB=window.__SB__;
var D={products:[]};
var P=[];
var $=function(s){return document.querySelector(s)};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})};
var money=function(n){return 'L '+Number(n||0).toLocaleString('es-HN',{maximumFractionDigits:2})};
var MIN=1,SHOWP=true,store='Tienda';
var cart=[],cat='Todos',term='',cur=null,curSize='',curQty=1;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{cart=JSON.parse(lsGet('cat_cart_v1')||'[]')}catch(e){cart=[]}
function find(id){for(var i=0;i<P.length;i++)if(P[i].id===id)return P[i];return null}
function saveCart(){lsSet('cat_cart_v1',JSON.stringify(cart))}
function maxFor(id,size){var p=find(id);return(p&&p.st&&p.st[size]!=null)?Number(p.st[size]):99}
function inCart(id,size){var q=0;cart.forEach(function(i){if(i.id===id&&String(i.size)===String(size))q+=i.qty});return q}
function pieces(){return cart.reduce(function(a,i){return a+i.qty},0)}
function total(){return cart.reduce(function(a,i){var p=find(i.id);return a+(p?p.price*i.qty:0)},0)}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},1700)}
function img(p){return p.image?'<img src="'+p.image+'" alt="'+esc(p.name)+'" loading="lazy">':'<span>'+esc((p.name||'?').charAt(0))+'</span>'}

function cats(){var s={};P.forEach(function(p){if(p.category)s[p.category]=1});return ['Todos'].concat(Object.keys(s).sort())}
function renderChips(){
  var c=cats();
  if(c.length<=2){$('#chips').innerHTML='';return}
  $('#chips').innerHTML=c.map(function(x){return '<button class="chip'+(x===cat?' on':'')+'" data-c="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
}
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.08}):null;
function renderGrid(){
  var t=term.trim().toLowerCase();
  var list=P.filter(function(p){
    if(cat!=='Todos'&&p.category!==cat)return false;
    if(!t)return true;
    return (p.name+' '+(p.color||'')+' '+(p.category||'')).toLowerCase().indexOf(t)>-1;
  });
  if(!list.length){$('#grid').innerHTML='<div class="empty">No encontramos productos con ese filtro.</div>';return}
  $('#grid').innerHTML=list.map(function(p){
    return '<button class="card" data-id="'+esc(p.id)+'"><div class="ph">'+img(p)+'</div><div class="cb"><h3>'+esc(p.name)+'</h3><small>'+esc([p.color,p.category].filter(Boolean).join(' · '))+'</small><div class="row">'+(SHOWP?'<span class="price">'+money(p.price)+'</span>':'<span></span>')+'<span class="pick">Elegir talla →</span></div></div></button>';
  }).join('');
  var cards=document.querySelectorAll('.card');
  cards.forEach(function(c,i){if(io){c.style.transitionDelay=Math.min(i%8,7)*40+'ms';io.observe(c)}else c.classList.add('in')});
}
function renderCount(){$('#cnt').textContent=pieces()}

function openVeil(on){$('#veil').classList.toggle('on',on)}
function openSheet(id){
  cur=find(id);if(!cur)return;curSize='';curQty=1;drawSheet();
  $('#sheet').classList.add('on');openVeil(true);
}
function drawSheet(){
  var p=cur;var avail=curSize?Math.max(0,maxFor(p.id,curSize)-inCart(p.id,curSize)):99;if(curSize&&curQty>avail)curQty=Math.max(1,avail);
  $('#sheet').innerHTML='<div class="sh-top"><div class="sh-img">'+img(p)+'</div><div style="flex:1;min-width:0"><h2>'+esc(p.name)+'</h2><p>'+esc([p.color,p.category].filter(Boolean).join(' · '))+'</p>'+(SHOWP?'<p style="margin-top:6px;color:var(--ink);font-weight:800;font-size:17px">'+money(p.price)+'</p>':'')+'</div><button class="x" data-act="closeSheet" aria-label="Cerrar">✕</button></div>'
   +'<div class="lbl">Talla</div><div class="sizes">'+p.sizes.map(function(s){return '<button class="sz'+(String(s)===curSize?' on':'')+'" data-s="'+esc(s)+'">'+esc(s)+'</button>'}).join('')+'</div>'
   +'<div class="lbl">Cantidad</div><div class="qtyrow"><div class="stepper"><button data-act="qm" aria-label="Menos">−</button><b>'+curQty+'</b><button data-act="qp" aria-label="Más">+</button></div></div>'
   +'<div style="margin-top:22px"><button class="btn" data-act="add" '+((curSize&&avail>0)?'':'disabled')+'>'+(!curSize?'Elige una talla':(avail>0?'Agregar al pedido':'Ya agregaste todo lo disponible'))+'</button></div>';
}
function closeAll(){$('#sheet').classList.remove('on');$('#drawer').classList.remove('on');openVeil(false)}

function addToCart(){
  if(!cur||!curSize)return;if(maxFor(cur.id,curSize)-inCart(cur.id,curSize)<=0)return;
  var f=null;cart.forEach(function(i){if(i.id===cur.id&&String(i.size)===String(curSize))f=i});
  if(f)f.qty=Math.min(maxFor(cur.id,curSize),f.qty+curQty);else cart.push({id:cur.id,size:String(curSize),qty:curQty});
  saveCart();renderCount();closeAll();toast('Agregado a tu pedido ✓');
}
function openCart(){drawCart();$('#drawer').classList.add('on');openVeil(true)}
function drawCart(){
  var n=pieces(),miss=Math.max(0,MIN-n);
  var body;
  if(!cart.length){body='<div class="emptycart"><p style="font-size:34px;margin:0 0 6px">🛍️</p><b>Tu pedido está vacío</b><p>Elige productos del catálogo para empezar.</p></div>'}
  else body=cart.map(function(it,idx){
    var p=find(it.id);
    return '<div class="item"><div class="th">'+img(p)+'</div><div class="in"><h4>'+esc(p.name)+'</h4><p>Talla '+esc(it.size)+(SHOWP?' · '+money(p.price):'')+'</p><div class="ctl"><div class="stepper"><button data-act="cm" data-i="'+idx+'">−</button><b>'+it.qty+'</b><button data-act="cp" data-i="'+idx+'">+</button></div><button class="rm" data-act="rm" data-i="'+idx+'">Quitar</button></div></div></div>';
  }).join('');
  var foot='';
  if(cart.length){
    var name=lsGet('cat_name')||'',city=lsGet('cat_city')||'';
    foot='<div class="two"><div class="fld"><label>Tu nombre *</label><input id="cn" value="'+esc(name)+'" autocomplete="name" placeholder="Nombre y apellido"></div><div class="fld"><label>Ciudad</label><input id="cc" value="'+esc(city)+'" autocomplete="address-level2" placeholder="Ej. San Pedro Sula"></div></div>'
     +(MIN>1&&miss>0?'<div class="note warn">Pedido mínimo: '+MIN+' piezas. Agrega '+miss+' más para poder enviarlo.</div>':'')
     +(SHOWP?'<div class="tot"><span>Total ('+n+' '+(n===1?'pieza':'piezas')+')</span><span>'+money(total())+'</span></div>':'<div class="tot"><span>Piezas</span><span>'+n+'</span></div>')
     +'<button class="btn wa" data-act="send" '+(miss>0?'disabled':'')+'>Enviar pedido por WhatsApp</button>'
     +'<div class="note">Te confirmamos disponibilidad y entrega por WhatsApp. No se hace ningún cobro en esta página.</div>'
     +'<button class="rm" data-act="clear" style="align-self:center">Vaciar pedido</button>';
  }
  $('#drawer').innerHTML='<div class="dr-h"><h2>Mi pedido</h2><button class="x" data-act="closeAll" aria-label="Cerrar">✕</button></div><div class="dr-b">'+body+'</div>'+(foot?'<div class="dr-f">'+foot+'</div>':'');
}
function refCode(){return 'P'+Date.now().toString(36).toUpperCase().slice(-5)}
function send(){
  var name=($('#cn').value||'').trim(),city=($('#cc').value||'').trim();
  if(!name){toast('Escribe tu nombre');$('#cn').focus();return}
  lsSet('cat_name',name);lsSet('cat_city',city);
  var L=[];
  L.push('🛍️ *PEDIDO · '+store+'*');
  var ref=refCode();L.push('Ref: '+ref);
  L.push('Cliente: '+name);
  if(city)L.push('Ciudad: '+city);
  L.push('');
  cart.forEach(function(it,i){
    var p=find(it.id);
    L.push((i+1)+'. *'+p.name+'* ('+p.id+')');
    L.push('   Talla: '+it.size+' · Cant: '+it.qty+(SHOWP?' · '+money(p.price)+' c/u':''));
  });
  L.push('');
  L.push('Total piezas: '+pieces());
  if(SHOWP)L.push('Total: '+money(total()));
  L.push('');
  L.push('¿Me confirmas disponibilidad y envío?');
  try{fetch(SB.url+'/rest/v1/catalog_orders',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json',apikey:SB.key,Authorization:'Bearer '+SB.key,Prefer:'return=minimal'},body:JSON.stringify({ref:ref,customer:name,city:city,message:L.join('\n'),total:total(),pieces:pieces()})}).catch(function(){})}catch(e){}
  var url='https://wa.me/'+String(D.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(L.join('\n'));
  window.open(url,'_blank');
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button,.veil');if(!t)return;
  if(t.id==='veil'||t.dataset.act==='closeAll'||t.dataset.act==='closeSheet'){closeAll();return}
  if(t.id==='openCart'){openCart();return}
  if(t.classList.contains('chip')){cat=t.dataset.c;renderChips();renderGrid();return}
  if(t.classList.contains('card')){openSheet(t.dataset.id);return}
  if(t.classList.contains('sz')){curSize=t.dataset.s;drawSheet();return}
  var a=t.dataset.act,i=Number(t.dataset.i);
  if(a==='qm'){curQty=Math.max(1,curQty-1);drawSheet()}
  else if(a==='qp'){var av=curSize?Math.max(0,maxFor(cur.id,curSize)-inCart(cur.id,curSize)):99;if(curQty+1>av){toast('Es todo lo que tenemos disponible en esa talla')}else{curQty=Math.min(99,curQty+1)}drawSheet()}
  else if(a==='add')addToCart();
  else if(a==='cm'){cart[i].qty=Math.max(1,cart[i].qty-1);saveCart();renderCount();drawCart()}
  else if(a==='cp'){if(cart[i].qty+1>maxFor(cart[i].id,cart[i].size)){toast('Es todo lo que tenemos disponible en esa talla')}else{cart[i].qty+=1;saveCart();renderCount()}drawCart()}
  else if(a==='rm'){cart.splice(i,1);saveCart();renderCount();drawCart()}
  else if(a==='clear'){cart=[];saveCart();renderCount();drawCart()}
  else if(a==='send')send();
});
$('#q').addEventListener('input',function(e){term=e.target.value;renderGrid()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});


function applyData(nd){
  D=nd||{products:[]};P=D.products||[];
  MIN=Math.max(1,Number(D.min)||1);SHOWP=D.showPrice!==false;store=D.store||'Tienda';
  document.title='Catálogo · '+store;
  $('#logo').innerHTML=(D.logo?'<img src="'+esc(D.logo)+'" alt="" style="width:28px;height:28px;border-radius:8px;object-fit:cover">':'<i></i>')+esc(store);
  $('#h1').textContent=store;
  $('#intro').textContent=D.intro||'Elige tus tallas, arma tu pedido y envíalo por WhatsApp.';
  $('#minpill').innerHTML=MIN>1?'<span class="pill">Pedido mínimo: '+MIN+' piezas</span>':'';
  $('#foot').textContent='© '+new Date().getFullYear()+' '+store+' · Pedidos por WhatsApp';
  cart=cart.filter(function(it){var p=find(it.id);return p&&p.sizes.indexOf(String(it.size))>-1&&it.qty>0});
  cart.forEach(function(it){it.qty=Math.min(it.qty,maxFor(it.id,it.size))});
  saveCart();
  if(cat!=='Todos'&&cats().indexOf(cat)<0)cat='Todos';
  if(cur){cur=find(cur.id);if(!cur){closeAll()}else if($('#sheet').classList.contains('on')){var keep=curSize;if(cur.sizes.indexOf(keep)<0)curSize='';drawSheet()}}
  renderChips();renderGrid();renderCount();
  var dr=$('#drawer');
  if(dr.classList.contains('on')&&!(document.activeElement&&dr.contains(document.activeElement)))drawCart();
}
function sbGet(path){
  return fetch(SB.url+'/rest/v1/'+path,{headers:{apikey:SB.key}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
}
function load(first){
  return Promise.all([sbGet('catalog_config?select=config&id=eq.1'),sbGet('catalog_items?select=*&order=sort_order.asc')]).then(function(res){
    var cfg=(res[0][0]&&res[0][0].config)||{};
    var prods=res[1].map(function(r){
      var sz=(Array.isArray(r.sizes)?r.sizes:[]).filter(function(x){return Number(x.stock)>0});
      sz.sort(function(a,b){var na=parseFloat(a.size),nb=parseFloat(b.size);return(isNaN(na)||isNaN(nb))?String(a.size).localeCompare(String(b.size)):na-nb});
      var st={};sz.forEach(function(x){st[String(x.size)]=Number(x.stock)});
      return {id:String(r.id),name:r.name,category:r.category||'',color:r.color||'',price:Number(r.price)||0,image:r.image_url||'',sizes:sz.map(function(x){return String(x.size)}),st:st};
    }).filter(function(p){return p.sizes.length});
    applyData({store:cfg.store,phone:cfg.phone,min:cfg.min,showPrice:cfg.showPrice,intro:cfg.intro,logo:cfg.logo,products:prods});
  }).catch(function(){
    if(first)$('#grid').innerHTML='<div class="empty">No pudimos cargar el catálogo. Revisa tu conexión e intenta de nuevo.</div>';
  });
}
applyData({products:[]});
load(true);
setInterval(function(){if(document.visibilityState==='visible')load(false)},60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')load(false)});
})();
<\/script>
</body>
</html>
</script>
<script>
const STORAGE='negocio_stanceprime_v1';
const exampleProducts=[];
const defaultData={
 products:exampleProducts,
 orders:[],
 customers:[],
 expenses:[],
 cashMovements:[],
 allocations:[],
 distribution:{categories:[{id:'dueno',name:'Mi sueldo',pct:40,kind:'owner'},{id:'reinversion',name:'Reinversión',pct:30,kind:'business'},{id:'reserva',name:'Reserva',pct:20,kind:'business'},{id:'inversiones',name:'Inversiones',pct:10,kind:'business'}],minCash:0},
 settings:{period:'month',customFrom:'',customTo:''},
 checklist:[
  ['Capital inicial / capital de operación',false],
  ['Definir y contactar proveedores',false],
  ['Confirmar acceso al grupo/catálogo',false],
  ['Definir condiciones: costo, pago, disponibilidad',false],
  ['Crear página de Facebook profesional',false],
  ['Configurar WhatsApp Business',false],
  ['Seleccionar 5–10 productos iniciales',false],
  ['Preparar fotos y creativos',false],
  ['Publicar contenido orgánico',false],
  ['Configurar Meta Ads',false],
  ['Probar anuncios con presupuesto controlado',false],
  ['Definir proceso de cierre por WhatsApp',false],
  ['Preparar empaques / packaging',false],
  ['Configurar envíos nacionales',false],
  ['Registrar cada venta y cada gasto',false],
  ['Reinvertir utilidades',false],
  ['Automatizar cuando el volumen lo justifique',false],
  ['Evaluar Odoo / ERP cuando el negocio lo necesite',false],
  ['Meta: L50,000 de utilidad mensual',false]
 ],
 messages:[
  {title:'Disponibilidad',text:'¡Hola! Sí, con gusto le ayudo. ¿Qué modelo y qué talla está buscando?'},
  {title:'Confirmación de pedido',text:'Perfecto. Para confirmar su pedido necesito nombre completo, teléfono, ciudad y dirección de entrega.'},
  {title:'Seguimiento',text:'Hola 👋 Solo paso para confirmar si desea que le reserve el producto y coordinar el envío.'},
  {title:'Pedido enviado',text:'¡Listo! Su pedido ya fue enviado. Le compartiré la información de seguimiento en cuanto esté disponible.'}
 ],
 gemini:{apiKey:'',model:'gemini-3.8-flash',temperature:0.5,useWeb:true}
};
let data=load();
data.allocations=Array.isArray(data.allocations)?data.allocations:[];
data.distribution=normalizeDistribution(data.distribution);
data.settings=data.settings&&typeof data.settings==='object'?{...defaultData.settings,...data.settings}:{...defaultData.settings};
migrateSizeInventory();
save();
let currentView='dashboard';
let aiHistory=[];

const navItems=[
 ['dashboard','📊','Panel'],['orders','🛒','Ventas / Pedidos'],['products','📦','Inventario'],['catalog','🛍️','Catálogo'],['customers','👥','Clientes'],['expenses','💸','Gastos'],['finances','💰','Finanzas'],['ai','✨','Guía IA'],['messages','💬','WhatsApp'],['checklist','✅','Plan'],['settings','⚙️','Ajustes']
];
function sanitizeLegacyData(obj){return JSON.parse(JSON.stringify(obj))}
function load(){
 try{
  const raw=storeGet(STORAGE);
  if(raw){
    const parsed=JSON.parse(raw);
    const out=sanitizeLegacyData({...JSON.parse(JSON.stringify(defaultData)),...parsed});
    out.cashMovements=Array.isArray(out.cashMovements)?out.cashMovements:[];
    out.allocations=Array.isArray(out.allocations)?out.allocations:[];
    out.distribution=normalizeDistribution(out.distribution);
    out.settings=out.settings&&typeof out.settings==='object'?out.settings:{...defaultData.settings};
    out.settings={...defaultData.settings,...out.settings};
    out.products=Array.isArray(out.products)?out.products:[];
    out.orders=Array.isArray(out.orders)?out.orders:[];
    out.expenses=Array.isArray(out.expenses)?out.expenses:[];
    out.customers=Array.isArray(out.customers)?out.customers:[];
    out.catalog=out.catalog&&typeof out.catalog==='object'?out.catalog:{};
    out.messages=Array.isArray(out.messages)?out.messages:[];
    out.checklist=Array.isArray(out.checklist)?out.checklist:[];
    out.gemini=out.gemini&&typeof out.gemini==='object'?out.gemini:{...defaultData.gemini};
    out.gemini={...defaultData.gemini,...out.gemini};
    out.orders=out.orders.map(o=>({...o,paymentStatus:o.paymentStatus||'Pendiente',paymentMethod:o.paymentMethod||''}));
    return out;
  }
 }catch(e){}
 return sanitizeLegacyData(JSON.parse(JSON.stringify(defaultData)));
}
function storeGet(k){try{return localStorage.getItem(k)}catch(e){window.__mem=window.__mem||{};return window.__mem[k]??null}}
function storeSet(k,v){try{localStorage.setItem(k,v)}catch(e){window.__mem=window.__mem||{};window.__mem[k]=v;if(!window.__storageWarned){window.__storageWarned=true;setTimeout(()=>toast('⚠️ El navegador no permite guardar datos. Descargue respaldos seguido.'),400)}}}
function save(){storeSet(STORAGE,JSON.stringify(data));schedulePush()}
function money(n){return 'L '+Number(n||0).toLocaleString('es-HN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateNow(){return isoLocal(new Date())}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function setView(v){if(me&&!can(v)){toast('No tienes acceso a esta sección');return}currentView=v; render()}
function renderNav(){
 const nav=document.getElementById('nav');

function parseDateLocal(value){
 if(!value)return null;
 return new Date(String(value)+'T00:00:00');
}
function formatMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function getPeriodRange(mode=(data.settings?.period||'month')){
 const today=new Date(); today.setHours(0,0,0,0);
 let start=new Date(today), end=new Date(today);
 if(mode==='all'){
  start=new Date(1970,0,1); end=new Date(2999,11,31);
 }else if(mode==='year'){
  start=new Date(today.getFullYear(),0,1); end=today;
 }else if(mode==='lastmonth'){
  start=new Date(today.getFullYear(),today.getMonth()-1,1); end=new Date(today.getFullYear(),today.getMonth(),0);
 }else if(mode==='30'){
  start=new Date(today); start.setDate(start.getDate()-29); end=today;
 }else if(mode==='custom'){
  const from=parseDateLocal(data.settings?.customFrom), to=parseDateLocal(data.settings?.customTo);
  start=from||new Date(today.getFullYear(),today.getMonth(),1); end=to||today;
 }else{
  start=new Date(today.getFullYear(),today.getMonth(),1); end=today;
 }
 end.setHours(23,59,59,999);
 return {start,end,mode};
}
function dateInRange(value,range){
 const d=parseDateLocal(value); if(!d)return false;
 d.setHours(12,0,0,0); return d>=range.start && d<=range.end;
}
function periodLabel(range){
 const labels={month:'Este mes',lastmonth:'Mes pasado',year:'Este año','30':'Últimos 30 días',all:'Todo el tiempo',custom:'Periodo personalizado'};
 return labels[range.mode]||'Periodo seleccionado';
}
function periodControlsBase(){
 const mode=data.settings?.period||'month';
 return `<div class="period-bar"><span class="label">Ver:</span><select onchange="changePeriod(this.value)">
   <option value="month" ${mode==='month'?'selected':''}>Este mes</option>
   <option value="lastmonth" ${mode==='lastmonth'?'selected':''}>Mes pasado</option>
   <option value="30" ${mode==='30'?'selected':''}>Últimos 30 días</option>
   <option value="year" ${mode==='year'?'selected':''}>Este año</option>
   <option value="all" ${mode==='all'?'selected':''}>Todo el tiempo</option>
   <option value="custom" ${mode==='custom'?'selected':''}>Personalizado</option>
  </select>${mode==='custom'?`<input id="periodFrom" type="date" value="${esc(data.settings?.customFrom||'')}"><span class="small">a</span><input id="periodTo" type="date" value="${esc(data.settings?.customTo||'')}"><button class="btn btn-light" onclick="applyCustomPeriod()">Aplicar</button>`:''}</div>`;
}
function setupNotice(all){
 if(all.allContributions>0||all.allPurchases>0||all.inventoryValue<=0)return '';
 return `<div class="alert alert-warn"><b>Falta registrar su capital inicial.</b> Tiene ${money(all.inventoryValue)} en inventario, pero no hay ningún aporte ni compra registrada, por eso la caja puede salir en cero o negativa. Registre como Aporte el dinero que tiene hoy disponible para el negocio (efectivo o cuenta). La mercancía que ya pagó no se descuenta de la caja.<div class="actions" style="margin-top:8px"><button class="btn btn-primary" onclick="openCashMovement()">Registrar aporte</button><button class="btn btn-light" onclick="openInventoryPurchase()">Registrar compra</button></div></div>`;
}
function periodControls(){return periodControlsBase()+setupNotice(getStats(getPeriodRange('all')))}
function changePeriod(mode){data.settings.period=mode;save();render()}
function applyCustomPeriod(){
 const from=document.getElementById('periodFrom')?.value||'', to=document.getElementById('periodTo')?.value||'';
 if(!from||!to){toast('Seleccione fecha inicial y final');return}
 if(from>to){toast('La fecha inicial debe ser anterior');return}
 data.settings.customFrom=from; data.settings.customTo=to; data.settings.period='custom'; save(); render();
}
function getStats(range=getPeriodRange('all')){
 const valid=data.orders.filter(o=>o.status!=='Cancelado');
 const inPeriod=o=>dateInRange(o.date,range);
 const paidDate=o=>o.paidDate||o.date;
 const sales=valid.filter(inPeriod).reduce((a,o)=>a+Number(o.total||0),0);
 const cogs=valid.filter(inPeriod).reduce((a,o)=>a+Number(o.cost||0),0);
 const paid=valid.filter(o=>o.paymentStatus==='Cobrado' && dateInRange(paidDate(o),range));
 const paidSales=paid.reduce((a,o)=>a+Number(o.total||0),0);
 const paidCogs=paid.reduce((a,o)=>a+Number(o.cost||0),0);
 const expenses=data.expenses.filter(e=>dateInRange(e.date,range)).reduce((a,e)=>a+Number(e.amount||0),0);
 const purchases=data.cashMovements.filter(m=>m.type==='Compra de inventario' && dateInRange(m.date,range)).reduce((a,m)=>a+Number(m.amount||0),0);
 const contributions=data.cashMovements.filter(m=>m.type==='Aporte' && dateInRange(m.date,range)).reduce((a,m)=>a+Number(m.amount||0),0);
 const withdrawals=data.cashMovements.filter(m=>m.type==='Retiro' && dateInRange(m.date,range)).reduce((a,m)=>a+Number(m.amount||0),0);
 const profit=sales-cogs-expenses;
 const grossProfit=sales-cogs;
 const netMarginPct=sales?profit/sales*100:0;
 const grossMarginPct=sales?grossProfit/sales*100:0;
 const avgTicket=valid.filter(inPeriod).length?sales/valid.filter(inPeriod).length:0;
 const pending=valid.filter(o=>['Pendiente','Confirmado','Enviado'].includes(o.status)).filter(inPeriod).length;
 const receivable=valid.filter(o=>o.paymentStatus!=='Cobrado').reduce((a,o)=>a+Number(o.total||0),0);
 const stockUnits=data.products.reduce((a,p)=>a+Number(p.stock||0),0);
 const inventoryValue=data.products.reduce((a,p)=>a+Number(p.stock||0)*Number(p.cost||0),0);
 const allRange=getPeriodRange('all');
 const allValid=data.orders.filter(o=>o.status!=='Cancelado');
 const allPaid=allValid.filter(o=>o.paymentStatus==='Cobrado');
 const allPaidSales=allPaid.reduce((a,o)=>a+Number(o.total||0),0);
 const allPurchases=data.cashMovements.filter(m=>m.type==='Compra de inventario').reduce((a,m)=>a+Number(m.amount||0),0);
 const allExpenses=data.expenses.reduce((a,e)=>a+Number(e.amount||0),0);
 const allContributions=data.cashMovements.filter(m=>m.type==='Aporte').reduce((a,m)=>a+Number(m.amount||0),0);
 const allWithdrawals=data.cashMovements.filter(m=>m.type==='Retiro').reduce((a,m)=>a+Number(m.amount||0),0);
 const cash=allPaidSales-allPurchases-allExpenses+allContributions-allWithdrawals;
 const capitalNet=allContributions-allWithdrawals;
 const allocAll={
  reinversion:data.allocations.filter(a=>a.type==='Reinversión').reduce((x,a)=>x+Number(a.amount||0),0),
  reserva:data.allocations.filter(a=>a.type==='Reserva').reduce((x,a)=>x+Number(a.amount||0),0),
  total:data.allocations.reduce((x,a)=>x+Number(a.amount||0),0)
 };
 return {sales,cogs,paidSales,paidCogs,expenses,purchases,contributions,withdrawals,profit,grossProfit,netMarginPct,grossMarginPct,avgTicket,pending,receivable,stockUnits,inventoryValue,cash,capitalNet,allocAll,allPaidSales,allPurchases,allExpenses,allContributions,allWithdrawals,rangeLabel:periodLabel(range)};
}
function monthlyTrendHTML(){
 const now=new Date(); now.setDate(1);
 const rows=[];
 for(let i=11;i>=0;i--){
  const d=new Date(now.getFullYear(),now.getMonth()-i,1);
  const key=formatMonthKey(d);
  const next=new Date(d.getFullYear(),d.getMonth()+1,1); next.setDate(0);
  const r={start:d,end:next};
  const sales=data.orders.filter(o=>o.status!=='Cancelado' && String(o.date||'').startsWith(key)).reduce((a,o)=>a+Number(o.total||0),0);
  const profit=data.orders.filter(o=>o.status!=='Cancelado' && String(o.date||'').startsWith(key)).reduce((a,o)=>a+Number(o.total||0)-Number(o.cost||0),0)-data.expenses.filter(e=>String(e.date||'').startsWith(key)).reduce((a,e)=>a+Number(e.amount||0),0);
  rows.push({key,sales,profit,label:d.toLocaleDateString('es-HN',{month:'short'})});
 }
 const max=Math.max(1,...rows.map(x=>x.sales));
 return `<div class="trend">${rows.map(x=>`<div class="trend-row"><div class="trend-label">${x.label}</div><div class="trend-bar"><div style="width:${Math.max(1,x.sales/max*100)}%"></div></div><div class="trend-value">${money(x.sales)} · ${money(x.profit)}</div></div>`).join('')}</div><div class="footer-note">Cada fila muestra Ventas · Utilidad estimada. Últimos 12 meses.</div>`;
}
function inventoryValueRows(){
 return [...data.products].sort((a,b)=>(b.stock*b.cost)-(a.stock*a.cost)).slice(0,8).map(p=>`<div class="allocation-row"><span>${esc(p.name)}</span><b>${money(Number(p.stock||0)*Number(p.cost||0))}</b></div>`).join('');
}
function financialLedger(range=getPeriodRange('all')){
 const rows=[];
 data.orders.filter(o=>o.status!=='Cancelado'&&o.paymentStatus==='Cobrado'&&dateInRange(o.paidDate||o.date,range)).forEach(o=>rows.push({date:o.paidDate||o.date,type:'Cobro de venta',detail:`${o.product}${o.size?` · talla ${o.size}`:''} · ${o.customer}`,amount:Number(o.total||0)}));
 data.cashMovements.filter(m=>dateInRange(m.date,range)).forEach(m=>rows.push({date:m.date,type:m.type,detail:m.detail||'',amount:m.type==='Aporte'?Number(m.amount||0):-Number(m.amount||0)}));
 data.expenses.filter(e=>dateInRange(e.date,range)).forEach(e=>rows.push({date:e.date,type:'Gasto',detail:`${e.category}${e.detail?` · ${e.detail}`:''}`,amount:-Number(e.amount||0)}));
 return rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function allocationSummary(){
 const r=data.allocations.filter(a=>a.type==='Reinversión').reduce((s,a)=>s+Number(a.amount||0),0);
 const res=data.allocations.filter(a=>a.type==='Reserva').reduce((s,a)=>s+Number(a.amount||0),0);
 return {reinversion:r,reserva:res,total:r+res};
}

function statusTag(st){const m={Pendiente:'tag-yellow',Confirmado:'tag-blue',Enviado:'tag-blue',Entregado:'tag-green',Cancelado:'tag-red'};return `<span class="tag ${m[st]||'tag-gray'}">${esc(st||'-')}</span>`}
function kpi(label,value,icon){return `<div class="card"><div class="kpi"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div><div class="kpi-icon">${icon}</div></div></div>`}
function tableOrders(rows){
 return `<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Total</th><th>Utilidad*</th><th>Cobro</th><th>Estado</th></tr></thead><tbody>${rows.map(o=>`<tr><td>${o.date}</td><td>${esc(o.customer)}</td><td>${esc(o.product)}</td><td>${money(o.total)}</td><td>${money((o.total||0)-(o.cost||0))}</td><td>${o.paymentStatus==='Cobrado'?'<span class="tag tag-green">Cobrado</span>':'<span class="tag tag-yellow">Pendiente</span>'}</td><td>${statusTag(o.status)}</td></tr>`).join('')}</tbody></table></div><div class="footer-note">* Antes de gastos publicitarios, empaque y otros costos.</div>`}

 </div>

function normalizeProductSizes(p){
 const clone={...p};
 let sizes=[];
 if(Array.isArray(clone.sizeStock)){
  sizes=clone.sizeStock.map(x=>({size:String(x.size),stock:Math.max(0,Number(x.stock||0))})).filter(x=>x.size!=='');
 }else if(Array.isArray(clone.sizes)){
  sizes=clone.sizes.map(x=>({size:String(x),stock:0})).filter(x=>x.size!=='');
 }else if(typeof clone.sizes==='string' && clone.sizes.trim()){
  const parts=clone.sizes.split(',').map(x=>x.trim()).filter(Boolean);
  const total=Math.max(0,Number(clone.stock||0));
  const base=parts.length?Math.floor(total/parts.length):0;
  let remainder=parts.length?total%parts.length:0;
  sizes=parts.map(size=>({size,stock:base+(remainder-->0?1:0)}));
 }
 clone.sizeStock=sizes;
 clone.sizes=sizes.map(x=>x.size).join(', ');
 clone.stock=sizes.reduce((a,x)=>a+x.stock,0);
 return clone;
}

/* ===== Plan de reparto de la utilidad ===== */
function defaultPlanCategories(){return [{id:'dueno',name:'Mi sueldo',pct:40,kind:'owner'},{id:'reinversion',name:'Reinversión',pct:30,kind:'business'},{id:'reserva',name:'Reserva',pct:20,kind:'business'},{id:'inversiones',name:'Inversiones',pct:10,kind:'business'}]}
function normalizeDistribution(d){
 const base={categories:defaultPlanCategories(),minCash:0};
 if(!d||typeof d!=='object')return base;
 let cats=Array.isArray(d.categories)?d.categories.filter(c=>c&&String(c.name||'').trim()).map((c,i)=>({id:String(c.id||('c'+i+'_'+Date.now())),name:String(c.name).trim(),pct:Math.max(0,Number(c.pct)||0),kind:c.kind==='owner'?'owner':'business'})):[];
 if(!cats.length)cats=base.categories;
 return {categories:cats,minCash:Math.max(0,Number(d.minCash)||0)};
}
function planStats(range=getPeriodRange()){
 const s=getStats(range), all=getStats(getPeriodRange('all'));
 const plan=normalizeDistribution(data.distribution);
 const sum=(arr,f)=>arr.reduce((a,x)=>a+Number(f(x)||0),0);
 const baseProfit=s.paidSales-s.paidCogs-s.expenses;
 const base=Math.max(0,baseProfit);
 const accumFree=Math.max(0,(all.paidSales-all.paidCogs-all.expenses)-all.withdrawals);
 const cajaLibre=Math.max(0,all.cash-plan.minCash);
 const firstOwner=plan.categories.find(c=>c.kind==='owner');
 const known=new Set(plan.categories.map(c=>c.id));
 const rows=plan.categories.map(c=>{
  const share=base*c.pct/100;
  let done=0;
  if(c.kind==='owner'){
   done=sum(data.cashMovements.filter(m=>m.type==='Retiro'&&dateInRange(m.forDate||m.date,range)&&(m.distId===c.id||((!m.distId||!known.has(m.distId))&&firstOwner&&firstOwner.id===c.id))),m=>m.amount);
  }else{
   done=sum(data.allocations.filter(a=>dateInRange(a.forDate||a.date,range)&&(a.catId===c.id||(!a.catId&&String(a.type||'').toLowerCase()===c.name.toLowerCase()))),a=>a.amount);
  }
  return {...c,share,done,left:Math.max(0,share-done),over:Math.max(0,done-share)};
 });
 const ownerLeft=sum(rows.filter(r=>r.kind==='owner'),r=>r.left);
 const canWithdraw=Math.max(0,Math.min(ownerLeft,accumFree,cajaLibre));
 let limit='share';
 if(ownerLeft>Math.min(accumFree,cajaLibre)) limit=cajaLibre<=accumFree?'caja':'ganancia';
 return {s,all,plan,rows,baseProfit,base,pctTotal:sum(plan.categories,c=>c.pct),ownerLeft,accumFree,cajaLibre,canWithdraw,limit,pendingProfit:Math.max(0,s.profit-baseProfit)};
}

 if(ps.limit==='caja')return `Su parte pendiente es ${money(ps.ownerLeft)}, pero la caja libre es ${money(ps.cajaLibre)} (caja actual ${money(ps.all.cash)}${ps.plan.minCash?` menos la caja mínima de ${money(ps.plan.minCash)}`:''}). Retire más cuando cobre sus pedidos pendientes.`;

function tryLocalCalculation(question){
 const q=String(question||'').trim().toLowerCase();
 const compact=q.replace(/\s+/g,' ');
 let m=compact.match(/(?:cu[aá]nto (?:es|da)|calcula|calcular|resultado de)\s+(?:el\s+)?(\d+(?:[\.,]\d+)?)\s*%\s*(?:de|del)\s*(\d+(?:[\.,]\d+)?)/i);
 if(m){
  const pct=Number(m[1].replace(',','.')), base=Number(m[2].replace(',','.')), r=base*pct/100;
  return `El ${pct}% de ${base} es **${r.toLocaleString('es-HN')}**.`;
 }
 const cleaned=compact
  .replace(/^\??\s*(cu[aá]nto (?:es|da)|calcula|calcular|resultado de)\s+/,'')
  .replace(/[l$€] ?/g,'')
  .replace(/,/g,'.');
 if(!/^[0-9+\-*/().%\s^]+$/.test(cleaned)) return null;
 if(!/[0-9]/.test(cleaned) || !/[+\-*/^%]/.test(cleaned)) return null;
 try{
  const expr=cleaned.replace(/\^/g,'**');
  if(/(?:\*\*\*|\.\.|\d\s*\.\s*\.)/.test(expr)) return null;
  const result=Function(`"use strict"; return (${expr})`)();
  if(typeof result!=='number' || !Number.isFinite(result)) return null;
  const formatted=result.toLocaleString('es-HN',{maximumFractionDigits:6});
  return `El resultado es **${formatted}**.`;
 }catch{return null;}
}

function formatAI(t){
 return esc(t)
  .replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\n/g,'<br>');
}

async function callGemini(model, systemText, historyMessages, currentQuestion){
 const contents=[];
 for(const m of (historyMessages||[]).slice(-10)){
  contents.push({role:m.role==='model'?'model':'user',parts:[{text:String(m.text||'')}]});
 }
 contents.push({role:'user',parts:[{text:String(currentQuestion||'')}]});
 const generationConfig={maxOutputTokens:1800};
 if(model!=='gemini-3.8-flash') generationConfig.temperature=Number(data.gemini.temperature??0.5);
 const body={contents,systemInstruction:{parts:[{text:systemText}]},generationConfig};
 if(data.gemini?.useWeb!==false && /^gemini-3\./.test(model)) body.tools=[{googleSearch:{}}];
 const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
  method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':data.gemini.apiKey},body:JSON.stringify(body)
 });
 const raw=await response.text();
 let payload={}; try{payload=JSON.parse(raw)}catch{}
 if(!response.ok){
  const err=new Error(payload?.error?.message||`Error HTTP ${response.status}`); err.status=response.status; throw err;
 }
 const answer=payload?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim()||'No recibí una respuesta de Gemini.';
 let sources=[];
 const chunks=payload?.candidates?.[0]?.groundingMetadata?.groundingChunks||[];
 for(const ch of chunks){
  if(ch?.web?.uri){sources.push({title:ch.web.title||ch.web.uri,uri:ch.web.uri})}
 }
 return {answer,sources:[...new Map(sources.map(x=>[x.uri,x])).values()].slice(0,5)};
}

async function askAI(){
 const input=document.getElementById('aiQuestion');
 const question=input?.value.trim();
 if(!question)return toast('Escriba una pregunta');
 if(!data.gemini?.apiKey){toast('Configure primero la clave de Gemini');setView('settings');return}
 const localCalc=tryLocalCalculation(question);
 aiHistory.push({role:'user',text:question});
 input.value='';
 render();
 const chat=document.getElementById('aiChat');
 if(chat) chat.innerHTML += `<div class="message"><div class="label">Guía IA</div><div class="txt">Pensando…</div></div>`;
 if(localCalc){
  aiHistory.push({role:'model',text:localCalc});
  render();
  return;
 }
 const preferred=data.gemini.model||'gemini-3.8-flash';
 const models=[...new Set([preferred,'gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite'])];
 let lastErr=null;
 for(const model of models){
  try{
   const history=aiHistory.slice(0,-1);
   const result=await callGemini(model,aiSystemPrompt(),history,question);
   data.gemini.lastModel=model;
   aiHistory.push({role:'model',text:result.sources?.length?`${result.answer}\n\nFuentes consultadas:\n${result.sources.map(s=>'- '+s.title+' — '+s.uri).join('\n')}`:result.answer});
   save();render();
   return;
  }catch(err){
   lastErr=err;
   const retryable=[429,500,502,503,504].includes(Number(err.status)) || /high demand|overload|temporar|unavailable|resource exhausted|quota/i.test(err.message||'');
   if(!retryable)break;
  }
 }
 const detail=lastErr?.message||'Error desconocido';
 aiHistory.push({role:'model',text:`No pude consultar Gemini en este momento. Se intentaron varios modelos compatibles. Revise su clave, límites de uso o pruebe de nuevo en unos segundos. Detalle: ${detail}`});
 render();
}

   const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);

 }; reader.readAsDataURL(file);

/* ---------- Descargar datos de la nube ---------- */
async function fetchAll(path){
 const out=[];const size=1000;
 for(let off=0;;off+=size){
  const rows=await api(path+'&limit='+size+'&offset='+off);
  out.push(...rows);if(rows.length<size)break;
 }
 return out;
}
function catDefaults(){return{store:'Stance Prime',phone:'9996-7113',min:1,showPrice:true,intro:'Estilo que marca presencia. Elige tu talla, arma tu pedido y envíalo por WhatsApp.',url:'',logo:'',logoHash:''}}
async function cloudPull(initial){
 const [recs,sets,cfg,items]=await Promise.all([
  fetchAll('/rest/v1/records?select=kind,id,payload&order=kind.asc,id.asc'),
  api('/rest/v1/settings?select=key,value'),
  api('/rest/v1/catalog_config?select=config&id=eq.1'),
  canSyncCatalog()?api('/rest/v1/catalog_items?select=*'):Promise.resolve([])
 ]);
 const sig=JSON.stringify([recs,sets,cfg]);
 if(!initial&&sig===lastPullSig)return{changed:false,empty:false};
 const next=JSON.parse(JSON.stringify(defaultData));
 KINDS.forEach(k=>{next[k]=[]});
 const st={};KINDS.forEach(k=>{st[k]={}});
 for(const r of recs){if(!next[r.kind])continue;next[r.kind].push(r.payload);st[r.kind][r.id]=JSON.stringify(r.payload)}
 KINDS.forEach(k=>next[k].sort((a,b)=>(a._t||0)-(b._t||0)));
 const ss={};
 for(const s of sets){
  ss[s.key]=JSON.stringify(s.value);
  if(s.key==='distribution')next.distribution=normalizeDistribution(s.value);
  else if(s.key==='checklist')next.checklist=Array.isArray(s.value.items)?s.value.items:next.checklist;
  else if(s.key==='profile')next.profile=s.value;
 }
 next.catalog={...catDefaults(),...((cfg[0]&&cfg[0].config)||{})};
 next.profile=next.profile&&typeof next.profile==='object'?next.profile:{appName:'Stance Prime',logo:''};
 next.gemini=(data&&data.gemini)||next.gemini;
 next.settings=(data&&data.settings)||next.settings;
 const empty=recs.length===0&&!sets.length&&!(cfg[0]);
 data=next;syncState=st;setState=ss;lastPullSig=sig;
 catState={items:{},cfg:JSON.stringify((cfg[0]&&cfg[0].config)||null)};
 for(const it of items){catState.items[it.id]={sig:itemSig(it),hash:it.image_hash||'',url:it.image_url||''}}
 if(!initial)storeSet(STORAGE,JSON.stringify(data));
 return{changed:true,empty};
}

/* ---------- Subir cambios a la nube ---------- */
function setSync(s,detail){
 window.__sync=s;
 const el=document.getElementById('syncChip');if(!el)return;
 const map={ok:['● Guardado en la nube','#16a34a'],saving:['● Guardando…','#d97706'],error:['● Sin conexión · reintentando','#dc2626'],idle:['','#94a3b8']};
 const m=map[s]||map.idle;el.textContent=detail||m[0];el.style.color=m[1];
}
function schedulePush(){
 if(!cloudReady)return;
 setSync('saving');
 clearTimeout(pushTimer);pushTimer=setTimeout(()=>{pushTimer=null;cloudPush()},700);
}
function ensureKeys(){
 for(const k of KINDS){
  for(const o of (data[k]||[])){
   if(!o||typeof o!=='object')continue;
   if(!o._t)o._t=Date.now()*1000+((++tSeq)%1000);
   if(k!=='products'&&k!=='orders'&&!o._k)o._k=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('k'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
  }
 }
}
function recId(k,o){return (k==='products'||k==='orders')?String(o.id):String(o._k)}
function diffRecords(){
 ensureKeys();
 const ups=[],dels=[];
 for(const k of KINDS){
  if(!canReadKind(k))continue;
  const cur={};for(const o of data[k]||[]){cur[recId(k,o)]=JSON.stringify(o)}
  const prev=syncState[k]||(syncState[k]={});
  for(const id in cur)if(prev[id]!==cur[id])ups.push({kind:k,id,s:cur[id]});
  for(const id in prev)if(!(id in cur))dels.push({kind:k,id});
 }
 return{ups,dels};
}
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
async function pushRecords(){
 const {ups,dels}=diffRecords();
 for(const part of chunk(ups,100)){
  await api('/rest/v1/records?on_conflict=kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:part.map(u=>({kind:u.kind,id:u.id,payload:JSON.parse(u.s)}))});
  part.forEach(u=>{syncState[u.kind][u.id]=u.s});
 }
 const byKind={};dels.forEach(d=>{(byKind[d.kind]=byKind[d.kind]||[]).push(d.id)});
 for(const k in byKind){
  for(const part of chunk(byKind[k],50)){
   const list=part.map(i=>'"'+String(i).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"').join(',');
   await api('/rest/v1/records?kind=eq.'+k+'&id=in.('+encodeURIComponent(list)+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});
   part.forEach(i=>{delete syncState[k][i]});
  }
 }
}
async function pushSettings(){
 const sets={distribution:data.distribution,checklist:{items:data.checklist||[]},profile:data.profile||{appName:'Stance Prime',logo:''}};
 for(const key in sets){
  const s=JSON.stringify(sets[key]);
  if(setState[key]===s||!canWriteSetting(key))continue;
  await api('/rest/v1/settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{key,value:sets[key]}});
  setState[key]=s;
 }
}
async function cloudPush(){
 if(!cloudReady)return;
 if(pushing){pushAgain=true;return}
 pushing=true;setSync('saving');clearTimeout(retryTimer);
 try{
  do{
   pushAgain=false;
   await pushRecords();
   await pushSettings();
   await syncCatalog();
  }while(pushAgain||pushTimer);
  setSync('ok');
 }catch(e){
  if(e&&(e.status===403||e.code==='42501')){
   toast('No tienes permiso para guardar algunos cambios. Se restauró lo que hay en la nube.');
   try{await cloudPull(true);render();setSync('ok')}catch(x){setSync('error')}
  }else{
   setSync('error');
   retryTimer=setTimeout(()=>{cloudPush()},8000);
  }
 }finally{pushing=false}
}

/* ---------- Catálogo en vivo ---------- */
function hash32(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36)+'-'+str.length.toString(36)}
function dataUrlToBlob(u){
 const m=/^data:([^;]+);base64,(.*)$/.exec(u);if(!m)return null;
 const bin=atob(m[2]);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 return new Blob([arr],{type:m[1]});
}
async function uploadPublic(dataUrl,name){
 const blob=dataUrlToBlob(dataUrl);if(!blob)return '';
 await api('/storage/v1/object/catalog/'+encodeURIComponent(name),{method:'POST',headers:{'Content-Type':blob.type,'x-upsert':'true'},body:blob});
 return SB_URL+'/storage/v1/object/public/catalog/'+encodeURIComponent(name);
}
function itemSig(r){return JSON.stringify([r.name,r.category||'',r.color||'',Number(r.price)||0,(r.sizes||[]).map(s=>s.size+':'+s.stock).join(','),Number(r.sort_order)||0,r.image_hash||''])}
async function syncCatalog(force){
 if(!canSyncCatalog())return;
 // 1) configuración pública
 const c=catCfg();
 let logo=c.logo||'',logoHash=c.logoHash||'';
 const pl=(data.profile&&data.profile.logo)||'';
 if(pl){const h=hash32(pl);if(h!==logoHash||!logo){logo=await uploadPublic(pl,'logo-'+h+'.png');logoHash=h}}
 else{logo='';logoHash=''}
 c.logo=logo;c.logoHash=logoHash;
 const pub={store:c.store,phone:catalogPhone(),min:Math.max(1,Number(c.min)||1),showPrice:c.showPrice!==false,intro:c.intro,url:c.url||'',logo,logoHash};
 const ps=JSON.stringify(pub);
 if(force||catState.cfg!==ps){
  await api('/rest/v1/catalog_config?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{id:1,config:pub}});
  catState.cfg=ps;
 }
 // 2) productos
 const list=[];
 let order=0;
 for(const p of catalogProducts()){
  const sizes=p.sizeStock.filter(x=>Number(x.stock)>0).map(x=>({size:String(x.size),stock:Number(x.stock)}));
  if(!sizes.length)continue;
  list.push({p,row:{id:String(p.id),name:p.name,category:p.category||'',color:p.color||'',price:Number(p.price)||0,sizes,sort_order:order++}});
 }
 const keep=new Set(list.map(x=>x.row.id));
 for(const {p,row} of list){
  const prev=catState.items[row.id];
  const h=p.image?hash32(p.image):'';
  row.image_hash=h;
  let url=prev?prev.url:'';
  if(h&&(!prev||prev.hash!==h||!url)){
   const small=await shrinkCatalogImage(p.image,560,0.72);
   url=await uploadPublic(small,'p-'+row.id.replace(/[^a-zA-Z0-9_-]/g,'_')+'-'+h+'.jpg');
  }else if(!h){url=''}
  row.image_url=url||null;
  const sg=itemSig(row);
  if(force||!prev||prev.sig!==sg||prev.url!==(url||'')){
   await api('/rest/v1/catalog_items?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:row});
   catState.items[row.id]={sig:sg,hash:h,url:url||''};
  }
 }
 const gone=Object.keys(catState.items).filter(id=>!keep.has(id));
 for(const part of chunk(gone,50)){
  const l=part.map(i=>'"'+String(i).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"').join(',');
  await api('/rest/v1/catalog_items?id=in.('+encodeURIComponent(l)+')',{method:'DELETE',headers:{Prefer:'return=minimal'}});
  part.forEach(i=>{delete catState.items[i]});
 }
}
function catCfg(){
 data.catalog={...catDefaults(),...(data.catalog&&typeof data.catalog==='object'?data.catalog:{})};
 return data.catalog;
}
function catalogProducts(){return (data.products||[]).map(normalizeProductSizes).filter(p=>p.active!==false&&Number(p.stock)>0)}
function catalogPhone(){let d=String(catCfg().phone||'').replace(/\D/g,'');if(d.length===8)d='504'+d;return d}
function readCatalogForm(){
 const g=id=>document.getElementById(id);if(!g('catStore'))return;

 c.store=g('catStore').value.trim()||'Mi tienda';

function saveCatalogSettings(){readCatalogForm();render();toast('Configuración del catálogo guardada')}
function shrinkCatalogImage(src,max,q){
 max=max||560;q=q||0.72;
 if(!src||!String(src).startsWith('data:'))return Promise.resolve(src||'');
 return new Promise(res=>{
  const img=new Image();
  img.onload=()=>{
   const s=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
   const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
   res(c.toDataURL('image/jpeg',q));
  };
  img.onerror=()=>res(src);
  img.src=src;
 });
}

function previewLogo(ev){

 rd.onload=()=>{
  const img=new Image();
  img.onload=()=>{

   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));

   document.getElementById('profLogoBox').innerHTML=`<img src="${window.pendingLogo}" style="width:100%;height:100%;object-fit:cover" alt="">`;
  };img.src=rd.result;
 };rd.readAsDataURL(file);ev.target.value='';
}

async function saveStaff(id){
 const name=document.getElementById('tName').value.trim(),user=normUser(document.getElementById('tUser').value);
 const permsEl=document.querySelector('.tperm');
 try{
  if(!id){
   if(!name){toast('Escribe el nombre del empleado');return}
   const r=await staffApi('create',{full_name:name,username:user||undefined,permissions:selectedPerms()});
   await loadTeam();
   credsModal('Empleado creado',r.username,r.password,'Compártele estos datos. Podrá cambiar su contraseña desde “Mi cuenta”.');
  }else{
   const body={id,full_name:name,username:user};
   const pw=document.getElementById('tPass')&&document.getElementById('tPass').value.trim();
   if(pw)body.password=pw;
   if(permsEl){body.permissions=selectedPerms();const a=document.getElementById('tActive');if(a)body.active=a.checked}
   await staffApi('update',body);
   closeModal();teamList=null;await loadTeam();toast('Cambios guardados');
   if(me&&id===me.id){const rows=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(me.id)+'&select=*');me=rows[0]||me;renderSideUser()}
  }
 }catch(e){toast(String(e.message||'No se pudo guardar').slice(0,120))}
}

/* ---------- Subir los datos que ya tenías en este navegador ---------- */
function promptMigrate(){
 const d=localSnapshot||{};
 showModal('Encontré datos en este navegador',`<p>Aquí había información guardada del sistema anterior:</p>
  <ul style="margin:8px 0 12px 18px;font-size:14px"><li><b>${(d.products||[]).length}</b> productos</li><li><b>${(d.orders||[]).length}</b> ventas</li><li><b>${(d.customers||[]).length}</b> clientes</li><li><b>${(d.expenses||[]).length}</b> gastos</li></ul>
  <p class="small">¿Quieres subirlos a la nube? Así quedan guardados, disponibles en cualquier dispositivo y conectados al catálogo. Si prefieres empezar de cero, descarga primero un respaldo.</p>
  <div class="actions" style="justify-content:space-between;margin-top:14px"><button class="btn btn-light" onclick="downloadLocalBackup()">Descargar respaldo</button><span><button class="btn btn-light" onclick="closeModal()">Empezar vacío</button> <button class="btn btn-primary" onclick="migrateLocal()">Subir mis datos</button></span></div>`);

function downloadLocalBackup(){
 const copy=JSON.parse(JSON.stringify(localSnapshot||{}));if(copy.gemini)copy.gemini.apiKey='';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}));a.download='respaldo_antes_de_subir_'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href);
}
async function migrateLocal(){
 const s=JSON.parse(JSON.stringify(localSnapshot));
 KINDS.forEach(k=>{data[k]=Array.isArray(s[k])?s[k]:[]});
 if(s.distribution)data.distribution=normalizeDistribution(s.distribution);
 if(Array.isArray(s.checklist)&&s.checklist.length)data.checklist=s.checklist;
 if(s.catalog&&typeof s.catalog==='object')data.catalog={...catDefaults(),...s.catalog};
 migrateSizeInventory();
 closeModal();toast('Subiendo tus datos…');
 save();
 clearTimeout(pushTimer);pushTimer=null;
 await cloudPush();
 render();toast(window.__sync==='ok'?'Tus datos ya están en la nube':'No se pudo terminar de subir. Se reintentará solo.');
}

/* ================= PEDIDOS POR WHATSAPP (importador) ================= */
function parseWhatsAppOrder(text){
 const out={customer:'',city:'',ref:'',items:[]};
 let cur=null;
 for(const raw of String(text||'').split(/\r?\n/)){
  const l=raw.replace(/\*/g,'').trim(); let m;
  if((m=l.match(/^(?:Cliente|Nombre)\s*:\s*(.+)$/i))){out.customer=m[1].trim();continue}
  if((m=l.match(/^Ciudad\s*:\s*(.+)$/i))){out.city=m[1].trim();continue}
  if((m=l.match(/^Ref\s*:\s*(.+)$/i))){out.ref=m[1].trim();continue}
  if((m=l.match(/^\d+\s*[.)]\s*.*\(([^()]+)\)\s*$/))){cur={code:m[1].trim(),size:'',qty:1,price:null};out.items.push(cur);continue}
  if(cur&&/Talla\s*:/i.test(l)){
   const s=l.match(/Talla\s*:\s*([^\s·|,]+)/i); if(s)cur.size=s[1];
   const q=l.match(/Cant(?:idad)?\s*:\s*(\d+)/i); if(q)cur.qty=Math.max(1,Number(q[1]));
   const pr=l.match(/L\s*(\d[\d.,]*)/); if(pr){const v=Number(pr[1].replace(/,/g,''));if(!isNaN(v))cur.price=v}
  }
 }
 return out;
}
function analyzeImport(){
 const txt=(typeof arguments[0]==='string'?arguments[0]:(document.getElementById('impText')?.value||'')).trim();
 if(!txt){toast('Pegue primero el mensaje del cliente');return}
 const o=parseWhatsAppOrder(txt);
 if(!o.items.length){toast('No encontré productos en ese mensaje');return}
 const used={};
 const rows=o.items.map(it=>{
  const p0=data.products.find(x=>String(x.id).toLowerCase()===it.code.toLowerCase());
  if(!p0)return {...it,name:it.code,ok:false,msg:'Código no encontrado'};
  const p=normalizeProductSizes(p0);
  const sr=p.sizeStock.find(x=>String(x.size).trim().toLowerCase()===String(it.size).trim().toLowerCase());
  const base={pid:p0.id,name:p0.name,size:it.size,qty:it.qty,price:it.price!=null?it.price:Number(p0.price||0),cost:Number(p0.cost||0)};
  if(!sr||Number(sr.stock)<=0)return {...base,ok:false,msg:'Talla no disponible'};
  const k=p0.id+'|'+sr.size; const already=used[k]||0;
  if(Number(sr.stock)-already<it.qty)return {...base,size:sr.size,ok:false,msg:`Solo hay ${Math.max(0,Number(sr.stock)-already)} en stock`};
  used[k]=already+it.qty;
  return {...base,size:sr.size,ok:true,msg:'Listo'};
 });
 window.importDraft={rows,ref:o.ref};
 const okRows=rows.filter(r=>r.ok), bad=rows.length-okRows.length;
 const total=okRows.reduce((a,r)=>a+r.price*r.qty,0);
 showModal('Revisar pedido importado',`
  <div class="form-grid three-cols">
   <div class="field"><label>Cliente *</label><input id="impName" value="${esc(o.customer)}"></div>
   <div class="field"><label>Teléfono del cliente *</label><input id="impPhone" placeholder="9999-9999"></div>
   <div class="field"><label>Ciudad</label><input id="impCity" value="${esc(o.city)}"></div>
   <div class="field"><label>Estado</label><select id="impStatus"><option>Pendiente</option><option>Confirmado</option></select></div>
  </div>
  <div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Producto</th><th>Talla</th><th>Cant.</th><th>Precio</th><th>Revisión</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.size)}</td><td>${r.qty}</td><td>${r.price!=null?money(r.price):'-'}</td><td><span class="tag ${r.ok?'tag-green':'tag-red'}">${esc(r.msg)}</span></td></tr>`).join('')}
  </tbody></table></div>
  <p class="small" style="margin-top:10px">${bad?`<b>${bad}</b> línea(s) con problema no se registrarán. `:''}Total a registrar: <b>${money(total)}</b>. El teléfono no viene en el mensaje: es el número desde el que le escribió el cliente.</p>
  <div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-light" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" ${okRows.length?'':'disabled'} onclick="saveImportedOrder()">Registrar pedido</button></div>`);
}
function saveImportedOrder(){
 const d=window.importDraft; if(!d)return;
 const customer=document.getElementById('impName').value.trim(), phone=document.getElementById('impPhone').value.trim(), city=document.getElementById('impCity').value.trim(), status=document.getElementById('impStatus').value;
 if(!customer||!phone){toast('Complete el nombre y el teléfono del cliente');return}
 const stamp=Date.now(); let lines=0,pieces=0;
 d.rows.filter(r=>r.ok).forEach((r,i)=>{
  const p=data.products.find(x=>x.id===r.pid); if(!p)return;
  const n=normalizeProductSizes(p); p.sizeStock=n.sizeStock; p.sizes=n.sizes; p.stock=n.stock;
  const sr=p.sizeStock.find(x=>String(x.size)===String(r.size));
  if(!sr||Number(sr.stock)<r.qty)return;
  sr.stock-=r.qty; p.stock=p.sizeStock.reduce((a,x)=>a+Number(x.stock||0),0);
  data.orders.push({id:'PED-'+stamp+'-'+(i+1),date:dateNow(),customer,customerPhone:phone,productId:p.id,product:p.name,size:String(sr.size),city,total:r.price*r.qty,cost:r.cost*r.qty,qty:r.qty,unitPrice:r.price,unitCost:r.cost,status,paymentStatus:'Pendiente',paymentMethod:'',paidDate:'',notes:'Pedido del catálogo'+(d.ref?' · Ref '+d.ref:''),inventoryAdjusted:true});
  lines++;pieces+=r.qty;
 });
 if(!lines){toast('No se pudo registrar: revise el stock');return}
 let c=data.customers.find(x=>x.phone===phone);
 if(!c){data.customers.push({name:customer,phone,city,updated:dateNow()})}else{c.name=customer;c.city=city||c.city;c.updated=dateNow()}
 if(d.ref){api('/rest/v1/catalog_orders?ref=eq.'+encodeURIComponent(d.ref)+'&status=eq.nuevo',{method:'PATCH',headers:{Prefer:'return=minimal'},body:{status:'importado'}}).then(refreshInbox).catch(function(){})}
 save();closeModal();window.importDraft=null;currentView='orders';render();
 toast(`Pedido registrado — ${pieces} pieza(s)`);
}

/* ---------- Pedidos que llegan directo del catálogo ---------- */
var inboxCount=0, inboxRows=[];
function paintInbox(){
 var b=document.getElementById('inboxPill');
 if(!b){b=document.createElement('button');b.id='inboxPill';b.className='btn btn-primary';b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:60;display:none;box-shadow:0 8px 25px rgba(0,0,0,.3)';b.onclick=openInbox;document.body.appendChild(b)}
 b.style.display=inboxCount?'block':'none';
 b.textContent='🔔 '+inboxCount+(inboxCount===1?' pedido nuevo':' pedidos nuevos')+' del catálogo';
}
async function refreshInbox(){
 if(!session||!me||!hasAny(['orders'])){inboxCount=0;paintInbox();return}
 try{const r=await api('/rest/v1/catalog_orders?select=id&status=eq.nuevo');const n=(r||[]).length;if(n>inboxCount&&inboxCount>=0&&window.inboxSeen)toast('Llegó un pedido nuevo del catálogo');inboxCount=n;window.inboxSeen=true}catch(e){return}
 paintInbox();
}
async function openInbox(){
 try{inboxRows=await api('/rest/v1/catalog_orders?select=*&status=eq.nuevo&order=created_at.desc')||[]}catch(e){toast('No se pudieron cargar los pedidos');return}
 if(!inboxRows.length){inboxCount=0;paintInbox();toast('No hay pedidos nuevos');return}
 const rows=inboxRows.map((r,i)=>{const o=parseWhatsAppOrder(r.message);const pcs=o.items.reduce((a,x)=>a+x.qty,0);
  return `<tr><td><b>${esc(r.customer)}</b><br><span class="small">${esc(r.city||'')} · Ref ${esc(r.ref)}</span></td><td>${pcs} pieza(s)</td><td>${r.total?money(r.total):'-'}</td><td class="small">${esc(new Date(r.created_at).toLocaleString('es-HN',{dateStyle:'short',timeStyle:'short'}))}</td><td style="white-space:nowrap"><button class="btn btn-primary" onclick="reviewInbox(${i})">Revisar</button> <button class="btn btn-light" onclick="discardInbox(${i})">Descartar</button></td></tr>`}).join('');
 showModal('Pedidos del catálogo',`<div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Piezas</th><th>Total</th><th>Hora</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><p class="small" style="margin-top:10px">Al revisar un pedido se comprueba el stock y puedes registrarlo. El teléfono del cliente lo ves en el WhatsApp.</p>`);
}
function reviewInbox(i){const r=inboxRows[i];if(!r)return;analyzeImport(r.message)}
async function discardInbox(i){
 const r=inboxRows[i];if(!r)return;
 if(!confirm('¿Descartar este pedido? No se registrará en ventas.'))return;
 try{await api('/rest/v1/catalog_orders?id=eq.'+encodeURIComponent(r.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:{status:'descartado'}});await refreshInbox();closeModal();if(inboxCount)openInbox();toast('Pedido descartado')}catch(e){toast('No se pudo descartar')}
}

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
boot();
